<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квизы</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


<div class="container">
    <h1>Все квизы</h1>

    <div style="text-align: center; margin-bottom: 2rem;">
        <button class="btn btn-auto" onclick="OpenModal()">Создать квиз</button>
    </div>

    <div id="quiz-list" class="quiz-qrid">
        <p class="empty">Загрузка...</p>
    </div>
</div>

<div id="modal-overlay" class="modal-overlay hidden"> 
    <div class="modal">
    <div class="modal-header">
        <h2>Новый квиз</h2>
        <button type="button" class="btn-close" onclick="CloseModal()">Отмена</button>
    </div>

    <form id="quiz-form" class="modal-form" onsubmit="submitQuiz(event)">
        <div class="form-group">
            <label for="f-title">Название</label>
            <input type="text" id="f-title" class="form-input" maxlength="100">
        </div>
        <div class="form-group">
            <label for="f-desc">Описание</label>
            <input type="text" id="f-desc" class="form-input" maxlength="500">
        </div>
        <div class="form-group">
            <label for="f-author">Автор</label>
            <input type="text" id="f-author" class="form-input" maxlength="100">
        </div>

        <div id="questions-container"></div>

        <button type="button" class="btn-add-question" onclick="AddQuestion()">Добавить вопрос</button>

        <div id="form-error" class="form-error hidden"></div>


        <button type="submit" id="submit-btn" class="btn">Создать квиз</button>
    </form>
    </div>
</div>


<script>

function OpenModal() {
    document.getElementById("quiz-form").reset();
    document.getElementById("questions-container").innerHTML = "";
    document.getElementById("modal-overlay").classList.remove("hidden");
}

function CloseModal() {
    document.getElementById("modal-overlay").classList.add("hidden");
}

function submitQuiz() {
    CloseModal();
}

let qCounter=0;
function AddQuestion() {
const qId = qCounter++;
const container = document.getElementById("questions-container");
const card = document.createElement("div");
card.className = "question-card";
card.dataset.qid = qId;
const num = document.querySelectorAll(".question-card").length + 1;

card.innerHTML = `

<div class="question-card-header">
    <span class="question-label">Вопрос ${num}</span>
    <button type="button" class="btn-ghost btn-danger"
     onclick="removeQuestion(this)">УДалить</button>
</div>
<input type="text" class="form-input q-text" placeholder="текст вопроса" maxlength=500>
<div class="answers-list">
    ${makeAnswerHTML(qId, true)}
    ${makeAnswerHTML(qId, false)}
</div>
<button type="button" class="btn-add-answer"
 onclick="addAnswer(${qId})">Добавить ответ</button>
`;
container.appendChild(card);
}

    function makeAnswerHTML(qId, checked) {
        return `
                <div class="answer-row">
                    <input type="radio" class="a-radio" name="correct-${qId}"
                           ${checked ? 'checked' : ''}>
                    <input type="text" class="form-input a-text"
                           placeholder="Вариант ответа" maxlength="200">
                    <button type="button" class="btn-ghost btn-danger"
                            onclick="removeAnswer(this)">✕</button>
                </div>
            `;
    }

    function removeQuestion(btn) {
        btn.closest('.question-card').remove();
        document.querySelectorAll('.question-card').forEach((card, i) => {
            card.querySelector('.question-label').textContent = `Вопрос ${i + 1}`;
        });
    }

    function addAnswer(qId) {
        const card = document.querySelector(`.question-card[data-qid="${qId}"]`);
        const list = card.querySelector('.answers-list');
        const addBtn = card.querySelector('.btn-add-answer');

        if (list.querySelectorAll('.answer-row').length >= 4) return; // лимит схемы

        list.insertAdjacentHTML('beforeend', makeAnswerHTML(qId, false));

        if (list.querySelectorAll('.answer-row').length >= 4) {
            addBtn.classList.add('hidden');
        }
    }

    function removeAnswer(btn) {
        const row = btn.closest('.answer-row');
        const list = row.closest('.answers-list');
        const card = list.closest('.question-card');

        if (list.querySelectorAll('.answer-row').length <= 2) return; // минимум 2

        const wasChecked = row.querySelector('.a-radio').checked;
        row.remove();

        if (wasChecked) list.querySelector('.a-radio').checked = true;

        card.querySelector('.btn-add-answer').classList.remove('hidden');
    }



</script>

</body>


</html>
